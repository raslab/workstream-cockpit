<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/workstream-cockpit-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = null;
        let systemDark = false;

        try {
          preference = window.localStorage.getItem('workstream-cockpit-theme');
        } catch {
          preference = null;
        }

        try {
          systemDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch {
          systemDark = false;
        }

        const shouldUseDark = preference === 'dark' || (preference !== 'light' && systemDark);
        document.documentElement.classList.toggle('dark', shouldUseDark);
      })();
    </script>
    <title>Workstream Cockpit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
